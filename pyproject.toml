[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plectis-zenith"
version = "0.1.0"
description = "Cutoff observations, Lab forecasts, Oracle feedback and reviewed Evolve changes"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Will Cook"}]
requires-python = ">=3.11"
dependencies = ["requests>=2.32,<3", "python-dotenv>=1.0,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<9", "numpy>=1.26,<3", "pandas>=2.2,<3", "jsonschema>=4.25,<5"]
browser = ["websocket-client>=1.8,<2", "pyperclip>=1.9,<2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["zenith*", "research*", "benchmark*", "system*", "tools*", "feedback*", "variants*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
