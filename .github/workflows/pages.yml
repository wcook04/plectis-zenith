name: Publish research website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: research-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Configure public Pages
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - name: Install and validate sources
        run: |
          python -m pip install -r requirements-test.lock
          python -m pip install --no-deps -e .
          python -m zenith validate
          python scripts/check_structure.py
          python scripts/check_extraction.py
      - name: Install and test the frontend
        run: |
          npm ci --prefix site
          npm test --prefix site
      - name: Build the existing frontend with static public data
        env:
          VITE_ZENITH_SNAPSHOT: "1"
          VITE_ZENITH_API: ${{ steps.pages.outputs.base_path }}
        run: |
          npm run build --prefix site -- --base="${{ steps.pages.outputs.base_path }}/"
          python scripts/export_site_snapshot.py site/dist
      - name: Upload website
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: site/dist
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy public reading website
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
