name: Offline reproduction

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-checkout:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install pinned test environment
        run: |
          python -m pip install -r requirements-test.lock
          python -m pip install --no-deps -e .
          python -m pip check
      - name: Check authored graph and projections
        run: |
          python -m zenith validate
          python -m zenith plan lab
          python scripts/check_extraction.py
      - name: Run offline regression suite
        run: python -m pytest tests
