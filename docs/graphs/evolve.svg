<text x="48" y="195" font-size="17" font-weight="600" fill="#334155">Delta Analyzer</text>
<text x="48" y="219" font-size="13" font-weight="normal" fill="#334155">paired Lab / Oracle runner inputs</text>
<rect x="340" y="160" width="315" height="90" rx="7" fill="#f5f7f9" stroke="#80958f"/>
<text x="352" y="195" font-size="17" font-weight="600" fill="#334155">Dossier Updater</text>
<text x="352" y="219" font-size="13" font-weight="normal" fill="#334155">proposed instruction / context change</text>
<rect x="690" y="160" width="315" height="90" rx="7" fill="#e6f3ef" stroke="#80958f"/>
<text x="702" y="195" font-size="17" font-weight="600" fill="#334155">Version Committer</text>
<text x="702" y="219" font-size="13" font-weight="normal" fill="#334155">explicit runner application</text>
