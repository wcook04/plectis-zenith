<text x="48" y="390" font-size="16" font-weight="600" fill="#334155">Paired feedback</text>
<text x="48" y="414" font-size="13" font-weight="normal" fill="#334155">freeze source bindings</text>
<path d="M 409 405 H 434 " class="dashed"/><polygon points="426,400 434,405 426,410" fill="#64748b"/>
<rect x="235" y="355" width="174" height="100" rx="7" fill="#fffaf0" stroke="#80958f"/>
<text x="247" y="390" font-size="16" font-weight="600" fill="#334155">Agent review</text>
<text x="247" y="414" font-size="13" font-weight="normal" fill="#334155">candidate or no_change</text>
