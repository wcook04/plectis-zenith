<text x="32" y="78" font-size="17" font-weight="normal" fill="#334155">The native dossier DAG and the daily policy workflow are separate paths.</text>
<text x="36" y="128" font-size="14" font-weight="600" fill="#64748b">NATIVE DOSSIER DAG</text>
<text x="36" y="329" font-size="14" font-weight="600" fill="#64748b">DAILY REVIEW WORKFLOW · conceptual controller steps</text>
