<text x="645" y="390" font-size="16" font-weight="600" fill="#334155">Matched comparison</text>
<text x="645" y="414" font-size="13" font-weight="normal" fill="#334155">same later inputs</text>
<rect x="832" y="355" width="174" height="100" rx="7" fill="#fffaf0" stroke="#80958f"/>
<text x="844" y="390" font-size="16" font-weight="600" fill="#334155">Retention review</text>
<text x="844" y="414" font-size="13" font-weight="normal" fill="#334155">explicit decision</text>
<path d="M 322 455 V 480" class="dashed"/><polygon points="317,472 322,480 327,472" fill="#64748b"/>
<text x="414" y="344" font-size="12" font-weight="normal" fill="#64748b">candidate path</text>
<rect x="235" y="480" width="245" height="60" rx="7" fill="#fffaf0" stroke="#80958f"/>
<text x="247" y="515" font-size="16" font-weight="600" fill="#334155">No change</text>
<text x="247" y="539" font-size="13" font-weight="normal" fill="#334155">keep current policy</text>
<text x="36" y="565" font-size="14" font-weight="normal" fill="#334155">A diagnosis or reviewed candidate is not forecast gain; later matched evidence informs retention.</text>
<text x="36" y="591" font-size="14" font-weight="normal" fill="#64748b">Research prototype. This is not financial advice.</text></svg>
