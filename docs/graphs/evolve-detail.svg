<rect x="36" y="231" width="640" height="50" rx="6" fill="#f8fafc" stroke="#a5afbd"/>
<text x="50" y="252" font-size="16" font-weight="600" fill="#334155">Paired frozen Lab + Oracle</text>
<text x="50" y="271" font-size="13" font-weight="normal" fill="#334155">make_review_packet / source bindings</text>
<rect x="36" y="331" width="640" height="50" rx="6" fill="#f8fafc" stroke="#a5afbd"/>
<text x="50" y="352" font-size="16" font-weight="600" fill="#334155">Pending Evolve handoff</text>
<text x="50" y="371" font-size="13" font-weight="normal" fill="#334155">export_agent_handoff; no inference</text>
<rect x="36" y="431" width="640" height="50" rx="6" fill="#f8fafc" stroke="#a5afbd"/>
<text x="50" y="452" font-size="16" font-weight="600" fill="#334155">Agent review → candidate / no_change</text>
<text x="50" y="471" font-size="13" font-weight="normal" fill="#334155">compile_review; frozen policy addon</text>
<rect x="36" y="531" width="640" height="50" rx="6" fill="#f8fafc" stroke="#a5afbd"/>
<text x="50" y="552" font-size="16" font-weight="600" fill="#334155">Next development Lab</text>
<text x="50" y="571" font-size="13" font-weight="normal" fill="#334155">daily next consumes the reviewed policy</text>
<rect x="36" y="631" width="640" height="50" rx="6" fill="#f8fafc" stroke="#a5afbd"/>
<text x="50" y="652" font-size="16" font-weight="600" fill="#334155">Matched later comparison</text>
<text x="50" y="671" font-size="13" font-weight="normal" fill="#334155">daily matchoff; same inputs, both versions</text>
<rect x="36" y="731" width="640" height="50" rx="6" fill="#f8fafc" stroke="#a5afbd"/>
<text x="50" y="752" font-size="16" font-weight="600" fill="#334155">Reviewed retention decision</text>
<text x="50" y="771" font-size="13" font-weight="normal" fill="#334155">daily retain; adoption is explicit</text>
<text x="750" y="271" font-size="17" font-weight="600" fill="#334155">Workflow boxes are not native node IDs.</text>
<text x="750" y="306" font-size="16" font-weight="normal" fill="#334155">Review can keep the current policy unchanged.</text>
<text x="750" y="339" font-size="16" font-weight="normal" fill="#334155">Candidate use on a development day is not promotion.</text>
<text x="750" y="372" font-size="16" font-weight="normal" fill="#334155">An Oracle diagnosis is a hypothesis, not measured gain.</text>
<text x="750" y="405" font-size="16" font-weight="normal" fill="#334155">Later matched comparison supports retention decisions.</text>
<text x="36" y="821" font-size="20" font-weight="600" fill="#334155">Native dossier DAG · declared dependencies below; live mutation requires explicit runner application</text>
<text x="36" y="876" font-size="16" font-weight="600" fill="#334155">delta_analyzer</text>
<text x="36" y="899" font-size="10" font-weight="normal" fill="#64748b">PREREQUISITES</text>
<text x="386" y="899" font-size="10" font-weight="normal" fill="#64748b">PRODUCED NODE</text>
