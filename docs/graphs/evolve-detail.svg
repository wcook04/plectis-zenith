<rect width="1440" height="1298" fill="#ffffff"/>
<text x="36" y="44" font-size="30" font-weight="600" fill="#334155">Evolve · native DAG and reviewed daily workflow</text>
<text x="36" y="75" font-size="16" font-weight="normal" fill="#334155">3 native nodes · 2 declared dependencies · arrows point to the consumer</text>
<text x="36" y="107" font-size="15" font-weight="normal" fill="#334155">Delta Analyzer receives the paired Lab CP2 and Oracle quartet through runner inputs, not a declared dependency edge.</text>
<text x="36" y="130" font-size="15" font-weight="normal" fill="#334155">Readiness gates block missing or unusable feedback. Exporting a handoff is not completed analysis or an applied patch.</text>
<text x="36" y="208" font-size="20" font-weight="600" fill="#334155">Active daily workflow · reviewed policy candidate, separate from the dossier DAG</text>
<path d="M 356 281 V 331" class="dependency" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<path d="M 356 381 V 431" class="dependency" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
