<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Zenith: learning executable observation models</title>
    <meta
      name="description"
      content="Executable observation models, native source experiments and measured revision. Read the Zenith paper and replay its controlled research evidence."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f8f0e2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1c1526" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="/fonts/plectis-serif.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/plectis-sans.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      try {
        var t = localStorage.getItem('zenith-theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <noscript>
      <p>Zenith is an experimental research prototype. This site needs JavaScript to read the research evidence.</p>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
